name: ACS 112 permission preflight
on:
  push:
    branches: [codex/acs-112-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [patch, integration, merge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Select and verify tested revision
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          PATCH_SHA=51974c6b16fb5d86048aba52f931198a796ba7d1
          BASE_SHA=185ef4ea54641522c2285baef11a6f8c0e41e34c
          git fetch https://github.com/GenAI-Security-Project/agent-control-standard.git "$BASE_SHA"
          if [ "$TARGET" = integration ]; then
            git checkout --detach "$BASE_SHA"
          else
            git checkout --detach "$PATCH_SHA"
          fi
          if [ "$TARGET" = merge ]; then
            git -c user.name=Preflight -c user.email=preflight@example.com merge --no-edit "$BASE_SHA"
          fi
          printf 'Patch SHA: %s\nBaseline SHA: %s\nTested SHA: %s\n' "$PATCH_SHA" "$BASE_SHA" "$(git rev-parse HEAD)"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Install and verify AGT
        working-directory: reference-implementations/agt
        run: |
          bun --version
          bun install --frozen-lockfile
          bun add --global trash-cli@7.2.0
          bun run typecheck
          bun test
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.9"
      - name: Install and verify Python guards and site artifacts
        env:
          GITHUB_PAGES_URL: https://genai-security-project.github.io/agent-control-standard/docs/
        run: |
          uv sync --locked
          uv run python --version
          uv run pytest -v
          uv run --no-dev mkdocs build --strict -d _site/docs
          uv run --no-dev python tools/render_landing.py landing _site
          uv run --no-dev python tools/publish_schemas.py specification _site/schema
